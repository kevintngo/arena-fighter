<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#04050a">
<title>VOIDLIGHT DUEL</title>
<style>
  html, body { margin: 0; position: fixed; inset: 0; background: #04050a; overflow: hidden; touch-action: none; overscroll-behavior: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; image-rendering: crisp-edges; image-rendering: pixelated; }
  #gl { z-index: 1; }
  #hud { z-index: 2; pointer-events: none; }
  #safe { position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #touch { position: fixed; inset: 0; z-index: 4; pointer-events: none; display: none; transition: opacity .6s; --s: clamp(54px, 17vmin, 84px); }
  #touch.on { display: block; }
  #touch.idle { opacity: .28; }
  #stick { position: absolute; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255,190,110,.4);
    background: radial-gradient(circle, rgba(255,180,90,.06), rgba(8,10,18,.3)); opacity: 0; transition: opacity .12s; }
  #knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%;
    background: rgba(255,186,96,.3); border: 2px solid rgba(255,210,140,.75); }
  .tb { position: absolute; pointer-events: auto; touch-action: none; border-radius: 50%; border: 2px solid rgba(255,190,110,.5); background: rgba(8,10,18,.38);
    color: #ffc878; padding: 0; outline: none; display: flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; }
  .tb svg { width: 46%; height: 46%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
  .tb.down { background: rgba(255,180,90,.34); transform: scale(.93); }
  #touch.menu { display: none; }
  .tb span { position: absolute; left: 0; right: 0; bottom: 12%; text-align: center; font: 700 9px/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; opacity: .85; pointer-events: none; }
  .tb svg { margin-top: -14%; }
  #bAtk { width: calc(var(--s) * 1.16); height: calc(var(--s) * 1.16); right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); }
  #bHvy { width: calc(var(--s) * .9); height: calc(var(--s) * .9); right: calc(var(--s) * 1.16 + 28px + env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); color: #ff9a6a; border-color: rgba(255,150,100,.5); }
  #bSpc { width: calc(var(--s) * .9); height: calc(var(--s) * .9); right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(var(--s) * 1.16 + 34px + env(safe-area-inset-bottom, 0px)); color: #c9a0ff; border-color: rgba(190,150,255,.5); }
  #bGrd { width: calc(var(--s) * .94); height: calc(var(--s) * .94); right: calc(var(--s) * 1.02 + 26px + env(safe-area-inset-right, 0px)); bottom: calc(var(--s) * .9 + 26px + env(safe-area-inset-bottom, 0px)); color: #8fd0ff; border-color: rgba(130,200,255,.5); }
  #fatal { position: fixed; left: 0; right: 0; top: 40%; z-index: 9; display: none; text-align: center; font: 14px/1.6 ui-monospace, Menlo, Consolas, monospace; color: #d9b36a; padding: 0 24px; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="safe"></div>
<div id="touch" aria-hidden="true">
  <div id="stick"><div id="knob"></div></div>
  <button id="bAtk" class="tb" aria-label="attack"><svg viewBox="0 0 24 24"><path d="M4 20 L17 7 M14 4 l6 6 M6 16 l2 2 M17 7 l3 -3"/></svg><span>ATTACK</span></button>
  <button id="bHvy" class="tb" aria-label="heavy attack"><svg viewBox="0 0 24 24"><path d="M12 3 l2.5 6 6.5 .5 -5 4.2 1.6 6.3 -5.6 -3.5 -5.6 3.5 1.6 -6.3 -5 -4.2 6.5 -.5 z"/></svg><span>HEAVY</span></button>
  <button id="bSpc" class="tb" aria-label="special"><svg viewBox="0 0 24 24"><path d="M13 2 L5 13 h6 l-1 9 8 -12 h-6 z"/></svg><span>SPECIAL</span></button>
  <button id="bGrd" class="tb" aria-label="guard"><svg viewBox="0 0 24 24"><path d="M12 3 l8 3 v6 c0 5 -4 8 -8 9 c-4 -1 -8 -4 -8 -9 v-6 z"/></svg><span>GUARD</span></button>
</div>
<div id="fatal"></div>
<script type="module">
